<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk2 — Reverse-Engineered Multilingual Transceiver (Light-Green & Warm-Orange UI)</title>
  <style>
    :root {
      --bg-primary: #0D1914;
      --bg-surface: #15261F;
      --bg-elevated: #1E352B;
      --border-subtle: #2A473B;
      --green: #34D399;
      --green-dark: #059669;
      --orange: #FB923C;
      --orange-deep: #EA580C;
      --red: #F43F5E;
      --text-main: #F0FDF4;
      --text-sub: #A7F3D0;
      --text-muted: #6EE7B7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #07100C; color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .top-banner { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .mode-pill { background: var(--bg-surface); color: var(--green); border: 1px solid var(--green); padding: 6px 12px; border-radius: 18px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .mode-pill.orange { color: var(--orange); border-color: var(--orange); }
    .phone { width: 392px; height: 800px; background: var(--bg-primary); border: 10px solid var(--bg-surface); border-radius: 44px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 24px 64px rgba(0,0,0,0.75); }
    .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); }
    .brand { font-size: 20px; font-weight: 900; color: var(--green); letter-spacing: 0.3px; }
    .bar-actions { display: flex; align-items: center; gap: 8px; }
    .lang-chip { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--green); padding: 5px 11px; border-radius: 16px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .icon-btn { width: 32px; height: 32px; border-radius: 16px; background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border-subtle); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .viewport { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 13px; }
    .card.active-border { border: 2px solid var(--green); }
    .card.orange-border { border: 2px solid var(--orange); }
    .row { display: flex; align-items: center; gap: 12px; }
    .glyph { width: 40px; height: 40px; border-radius: 20px; background: var(--bg-elevated); color: var(--orange); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
    .title { font-size: 15px; font-weight: 800; color: var(--text-main); }
    .sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; line-height: 1.35; }
    .btn-green { background: var(--green); color: #042117; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .btn-orange { background: var(--orange-deep); color: #FFF; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .btn-block { width: 100%; padding: 14px; font-size: 15px; border-radius: 14px; margin-top: 8px; }
    .chips-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chip { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-subtle); padding: 7px 12px; border-radius: 18px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip:hover { border-color: var(--orange); }
    .feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
    .bubble { max-width: 84%; padding: 10px 12px; border-radius: 14px; font-size: 14px; }
    .bubble.in { align-self: flex-start; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
    .bubble.out { align-self: flex-end; background: var(--green-dark); color: #FFF; }
    .bubble.alert { background: #7F1D1D; border: 1.5px solid var(--orange); }
    .ptt-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 22px; padding: 14px; text-align: center; }
    .mic-btn { width: 82px; height: 82px; border-radius: 41px; background: var(--green); color: #042117; border: 4px solid var(--bg-elevated); font-size: 30px; cursor: pointer; margin-top: 10px; transition: 0.15s; }
    .mic-btn.talking { background: var(--orange); color: #FFF; transform: scale(0.95); box-shadow: 0 0 24px rgba(251,146,60,0.7); }
    .bottom-nav { display: flex; justify-content: space-around; align-items: center; background: var(--bg-surface); padding: 8px 6px; border-top: 1px solid var(--border-subtle); }
    .nav-item { background: transparent; color: var(--text-sub); border: none; padding: 8px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .nav-item.active { background: var(--bg-elevated); color: var(--green); }
    .nav-item.alert-fab { background: var(--orange-deep); color: #FFF; padding: 10px 14px; border-radius: 20px; font-weight: 900; }
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.72); display: none; flex-direction: column; justify-content: flex-end; z-index: 30; }
    .modal.show { display: flex; }
    .sheet { background: var(--bg-surface); border-top: 2px solid var(--green); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 14px; }
    .tile { background: var(--bg-elevated); border: 1.5px solid var(--border-subtle); border-radius: 14px; padding: 16px 10px; text-align: center; cursor: pointer; font-weight: 700; color: var(--text-main); }
    .tile.selected { border-color: var(--orange); background: #2B3B2B; }
    input, textarea { width: 100%; background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="top-banner">
    <button class="mode-pill orange" onclick="startOnboarding()">✨ Preview 3-Step Onboarding (Screenshots 1–3)</button>
    <button class="mode-pill" onclick="finishOnboarding()">📱 Jump to Talk2 Main App</button>
  </div>

  <div class="phone">
    <div class="app-bar">
      <div class="brand">Talk2</div>
      <div class="bar-actions" id="barActions">
        <button class="lang-chip" id="topLangBtn" onclick="setTab('SETTINGS')">🌐 हिन्दी</button>
        <button class="icon-btn" onclick="startOnboarding()" title="Setup Profile">👤</button>
      </div>
    </div>

    <div class="viewport" id="viewport"></div>

    <!-- Connect to a channel Bottom Sheet (Screenshot 6) -->
    <div class="modal" id="connectModal">
      <div class="sheet">
        <div class="title" style="font-size:20px;margin-bottom:12px;">Connect to a channel</div>
        <div class="sub" style="color:var(--green);font-weight:800;">Wi-Fi Direct</div>
        <div class="grid-2">
          <div class="tile selected" id="ch-HOST_WIFI" onclick="pickChannel('HOST_WIFI')">📶 Host Wi-Fi</div>
          <div class="tile" id="ch-JOIN_WIFI" onclick="pickChannel('JOIN_WIFI')">📶 Join Wi-Fi</div>
        </div>
        <div class="sub" style="color:var(--orange);font-weight:800;">Bluetooth</div>
        <div class="grid-2">
          <div class="tile" id="ch-HOST_BT" onclick="pickChannel('HOST_BT')">ᛒ Host BT</div>
          <div class="tile" id="ch-JOIN_BT" onclick="pickChannel('JOIN_BT')">ᛒ Join BT</div>
        </div>
        <button class="btn-green btn-block" onclick="confirmConnect()">Connect</button>
      </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item active" id="nav-TALK" onclick="setTab('TALK')">🎤 Talk</button>
      <button class="nav-item" id="nav-RADAR" onclick="setTab('RADAR')">🧭 Radar</button>
      <button class="nav-item alert-fab" id="nav-ALERT" onclick="setTab('ALERT')">⚠️ Alert</button>
      <button class="nav-item" id="nav-HISTORY" onclick="setTab('HISTORY')">🕒 History</button>
      <button class="nav-item" id="nav-SETTINGS" onclick="setTab('SETTINGS')">⚙️ Settings</button>
    </div>
  </div>

  <script>
    const S = {
      step: 'DONE',
      bgModal: true,
      name: 'Siddhi',
      tab: 'TALK',
      connected: false,
      channel: 'HOST_WIFI',
      alertCh: 'All',
      compassDeg: 38,
      gyroRate: 0.8,
      githubUrl: 'https://github.com/Sanchit-044/iTantra/releases/download/model-pack-v1',
      aiSummary: "GPT Tactical Copilot: 3 devices in range. Nearest is Dev's F34 at 45° NE (6.4m, closing in). Wi-Fi Direct + BLE + Gyro locked.",
      lang: { code: 'hi', glyph: 'ह', endonym: 'हिन्दी', en: 'Hindi · default', mb: '78 MB' },
      packs: [
        { code: 'hi', glyph: 'ह', endonym: 'हिन्दी', en: 'Hindi · default', mb: '78 MB', dl: true, phrases: ['हाँ', 'नहीं', 'ठीक है', 'मदद चाहिए', 'रुकिए'] },
        { code: 'ta', glyph: 'த', endonym: 'தமிழ்', en: 'Tamil', mb: '82 MB', dl: false, phrases: ['ஆம்', 'இல்லை', 'சரி', 'உதவி வேண்டும்', 'காத்திருங்கள்'] },
        { code: 'bn', glyph: 'ব', endonym: 'বাংলা', en: 'Bengali', mb: '80 MB', dl: false, phrases: ['হ্যাঁ', 'না', 'ঠিক আছে', 'সাহায্য দরকার', 'অপেক্ষা করুন'] },
        { code: 'gu', glyph: 'ગ', endonym: 'ગુજરાતી', en: 'Gujarati', mb: '79 MB', dl: false, phrases: ['હા', 'ના', 'બરાબર', 'મદદ જોઈએ છે', 'રાહ જુઓ'] },
        { code: 'mr', glyph: 'म', endonym: 'मराठी', en: 'Marathi', mb: '81 MB', dl: false, phrases: ['हो', 'नाही', 'ठीक आहे', 'मदत हवी आहे', 'थांबा'] },
        { code: 'kn', glyph: 'ಕ', endonym: 'ಕನ್ನಡ', en: 'Kannada', mb: '80 MB', dl: false, phrases: ['ಹೌದು', 'ಇಲ್ಲ', 'ಸರಿ', 'ಸಹಾಯ ಬೇಕಾಗಿದೆ', 'ಕಾಯಿರಿ'] },
        { code: 'ml', glyph: 'മ', endonym: 'മലയാളം', en: 'Malayalam', mb: '81 MB', dl: false, phrases: ['അതെ', 'ഇല്ല', 'ശരി', 'സഹായം വേണം', 'കാത്തിരിക്കൂ'] },
        { code: 'te', glyph: 'తె', endonym: 'తెలుగు', en: 'Telugu', mb: '80 MB', dl: false, phrases: ['అవును', 'కాదు', 'సరే', 'సహాయం కావాలి', 'వేచి ఉండండి'] },
        { code: 'or', glyph: 'ଓ', endonym: 'ଓଡ଼ିଆ', en: 'Odia', mb: '79 MB', dl: false, phrases: ['ହଁ', 'ନା', 'ଠିକ୍ ଅଛି', 'ସାହାଯ୍ୟ ଦରକାର', 'ଅପେକ୍ଷା କରନ୍ତୁ'] },
        { code: 'en', glyph: 'E', endonym: 'English', en: 'English', mb: '45 MB', dl: true, phrases: ['Yes', 'No', 'Okay', 'Need help', 'Wait'] }
      ],
      peers: [
        { name: "Dev's F34", dist: 6.4, bearing: 45, dir: 'NE', radios: 'Wi-Fi Direct + BLE' },
        { name: 'NDRF-Relay-02', dist: 18.5, bearing: 130, dir: 'SE', radios: 'Wi-Fi Direct' },
        { name: 'Med-Unit-09', dist: 31.0, bearing: 285, dir: 'NW', radios: 'Bluetooth RFCOMM' }
      ],
      messages: [
        { dir: 'in', text: 'एन्क्लेव सेक्टर 4 में पानी बढ़ रहा है, नाव भेजें।', peer: "Dev's F34", status: 'RECEIVED', alert: false }
      ]
    };

    function startOnboarding() { S.step = 1; S.bgModal = true; render(); }
    function finishOnboarding() { S.step = 'DONE'; render(); }
    function setTab(t) {
      S.tab = t;
      ['TALK','RADAR','ALERT','HISTORY','SETTINGS'].forEach(k => {
        const el = document.getElementById('nav-' + k);
        if (el && k !== 'ALERT') el.classList.toggle('active', k === t);
      });
      render();
    }
    function pickChannel(ch) {
      S.channel = ch;
      ['HOST_WIFI','JOIN_WIFI','HOST_BT','JOIN_BT'].forEach(k => {
        document.getElementById('ch-' + k).classList.toggle('selected', k === ch);
      });
    }
    function confirmConnect() {
      S.connected = true;
      document.getElementById('connectModal').classList.remove('show');
      render();
    }
    function toggleDownload(code) {
      const p = S.packs.find(x => x.code === code);
      if (p) {
        p.dl = true;
        S.lang = p;
        document.getElementById('topLangBtn').innerText = '🌐 ' + p.endonym;
        render();
      }
    }
    function sendChat(text, isAlert = false) {
      S.messages.push({ dir: 'out', text, peer: S.connected ? "Dev's F34" : 'Queued (Offline)', status: S.connected ? 'DELIVERED' : 'QUEUED', alert: isAlert });
      render();
    }
    function rotateCompass(delta) {
      S.compassDeg = (S.compassDeg + delta + 360) % 360;
      S.gyroRate = (delta / 10).toFixed(1);
      render();
    }

    function render() {
      const vp = document.getElementById('viewport');
      const nav = document.getElementById('bottomNav');

      if (S.step !== 'DONE') {
        nav.style.display = 'none';
        if (S.step === 1) {
          vp.innerHTML = `
            <div class="sub" style="text-align:right;">Step 1 of 3</div>
            <div class="title" style="font-size:24px;">Your profile</div>
            <div style="width:104px;height:104px;border-radius:52px;border:2.5px solid var(--green);background:var(--bg-surface);margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;">
              👤
              <span style="position:absolute;bottom:0;right:0;background:var(--orange);width:30px;height:30px;border-radius:15px;font-size:14px;display:flex;align-items:center;justify-content:center;">📷</span>
            </div>
            <div class="sub">Name</div>
            <input value="${S.name}" oninput="S.name=this.value" placeholder="Operator Name" />
            ${S.bgModal ? `
              <div class="card orange-border" style="margin-top:14px;">
                <div class="title">Let app always run in background?</div>
                <div class="sub" style="margin:8px 0;">Allowing Talk2 to always run in the background keeps Wi-Fi Direct, Bluetooth, and emergency SOS listening active.</div>
                <div style="display:flex;gap:8px;justify-content:flex-end;">
                  <button class="chip" onclick="S.bgModal=false;render()">Deny</button>
                  <button class="btn-green" onclick="S.bgModal=false;render()">Allow</button>
                </div>
              </div>
            ` : ''}
            <button class="btn-green btn-block" style="margin-top:auto;" onclick="S.step=2;render()">Continue →</button>
          `;
        } else if (S.step === 2) {
          vp.innerHTML = `
            <div class="sub" style="text-align:right;">Step 2 of 3</div>
            <div class="title" style="font-size:22px;">Choose your languages</div>
            <div class="sub">The same language is used for speaking and listening. Hindi is selected by default. Tap any pack to download from GitHub Release / Google Drive.</div>
            <div style="overflow-y:auto;max-height:510px;display:flex;flex-direction:column;gap:8px;">
              ${S.packs.map(p => `
                <div class="card ${p.dl ? 'active-border' : ''}" style="cursor:pointer;" onclick="toggleDownload('${p.code}')">
                  <div class="row">
                    <div class="glyph">${p.glyph}</div>
                    <div style="flex:1;">
                      <div class="title">${p.endonym}</div>
                      <div class="sub">${p.en}</div>
                      <div class="sub">${p.mb} · ${p.dl ? '<span style="color:var(--green)">Downloaded ✓</span>' : 'Not downloaded'}</div>
                    </div>
                    <div style="color:${p.dl ? 'var(--green)' : 'var(--orange)'};font-weight:800;">${p.dl ? '✅' : '☁️⬇'}</div>
                  </div>
                </div>
              `).join('')}
            </div>
            <button class="btn-green btn-block" onclick="S.step=3;render()">Continue →</button>
          `;
        } else if (S.step === 3) {
          vp.innerHTML = `
            <div class="sub" style="text-align:right;">Step 3 of 3</div>
            <div class="title" style="font-size:22px;">Show the app in</div>
            <div class="sub">Menus and buttons use this language. Speaking still uses Active. English does not need a speech pack.</div>
            <div class="card active-border"><div class="row"><div class="glyph">E</div><div style="flex:1;"><div class="title">English</div><div class="sub">English</div></div><div>🔘</div></div></div>
            <div class="card"><div class="row"><div class="glyph">ह</div><div style="flex:1;"><div class="title">हिन्दी</div><div class="sub">Hindi</div></div><div>⚪</div></div></div>
            <button class="btn-green btn-block" style="margin-top:auto;" onclick="finishOnboarding()">Continue →</button>
          `;
        }
        return;
      }

      nav.style.display = 'flex';

      if (S.tab === 'TALK') {
        const phrases = S.lang.phrases || S.packs[0].phrases;
        vp.innerHTML = `
          <div class="card">
            <div class="row">
              <div class="glyph">📶</div>
              <div style="flex:1;">
                <div class="title">${S.connected ? "Dev's F34 (" + S.channel + ")" : 'Offline'}</div>
                <div class="sub">${S.connected ? 'AES-256-GCM Encrypted Link Active' : 'Tap Connect to choose Wi-Fi Direct or Bluetooth'}</div>
              </div>
              <button class="${S.connected ? 'btn-orange' : 'btn-green'}" onclick="${S.connected ? 'S.connected=false;render()' : "document.getElementById('connectModal').classList.add('show')"}">${S.connected ? 'Disconnect' : 'Connect'}</button>
            </div>
          </div>
          <div class="chips-row">
            ${phrases.map(ph => `<button class="chip" onclick="sendChat('${ph}')">💬 ${ph}</button>`).join('')}
          </div>
          <div class="feed">
            ${S.messages.map(m => `
              <div class="bubble ${m.dir} ${m.alert ? 'alert' : ''}">
                ${m.alert ? '<div style="color:var(--orange);font-size:11px;font-weight:900;">🚨 EMERGENCY SOS</div>' : ''}
                <div>${m.text}</div>
                <div style="font-size:10px;opacity:0.8;margin-top:4px;text-align:right;">${m.peer} · ${m.status} · 🔊</div>
              </div>
            `).join('')}
          </div>
          <div class="ptt-box">
            <div class="sub" id="pttLabel">${S.connected ? "Connected to Dev's F34 — Hold Mic to Talk" : 'Not connected - PTT will save and send later'}</div>
            <button class="mic-btn" onmousedown="this.classList.add('talking');document.getElementById('pttLabel').innerText='Listening (16kHz PCM → IndicWav2Vec INT8)...'" onmouseup="this.classList.remove('talking');sendChat('हम सुरक्षित हैं, सहायता पहुंच रही है।')">🎤</button>
          </div>
        `;
      } else if (S.tab === 'RADAR') {
        vp.innerHTML = `
          <div class="card">
            <div class="row" style="justify-content:space-between;">
              <div>
                <div class="title">🧭 Compass: ${S.compassDeg}° · Gyro: ${S.gyroRate}°/s</div>
                <div class="sub">📍 GPS: 28.6139° N, 77.2090° E · Wi-Fi + BLE + Gyro Fused</div>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn-orange" style="padding:6px 10px;" onclick="rotateCompass(-20)">↺ -20°</button>
                <button class="btn-orange" style="padding:6px 10px;" onclick="rotateCompass(20)">↻ +20°</button>
              </div>
            </div>
          </div>
          <div class="card" style="text-align:center;">
            <svg width="250" height="250" viewBox="0 0 250 250">
              <circle cx="125" cy="125" r="28" stroke="#2A473B" fill="none"/>
              <circle cx="125" cy="125" r="58" stroke="#2A473B" fill="none"/>
              <circle cx="125" cy="125" r="88" stroke="#2A473B" fill="none"/>
              <circle cx="125" cy="125" r="114" stroke="#2A473B" fill="none"/>
              <line x1="11" y1="125" x2="239" y2="125" stroke="#2A473B"/>
              <line x1="125" y1="11" x2="125" y2="239" stroke="#2A473B"/>
              <g transform="rotate(${-S.compassDeg} 125 125)">
                <text x="125" y="24" fill="#FB923C" font-size="12" font-weight="bold" text-anchor="middle">N</text>
                <text x="228" y="129" fill="#A7F3D0" font-size="11" text-anchor="middle">E</text>
                <text x="125" y="234" fill="#A7F3D0" font-size="11" text-anchor="middle">S</text>
                <text x="22" y="129" fill="#A7F3D0" font-size="11" text-anchor="middle">W</text>
                <circle cx="158" cy="84" r="7" fill="#FB923C"/>
                <text x="158" y="100" fill="#F0FDF4" font-size="10" text-anchor="middle">Dev's F34 (45° NE)</text>
                <circle cx="172" cy="168" r="6" fill="#34D399"/>
                <text x="172" y="182" fill="#F0FDF4" font-size="9" text-anchor="middle">NDRF-02 (130° SE)</text>
                <circle cx="52" cy="105" r="6" fill="#34D399"/>
                <text x="52" y="119" fill="#F0FDF4" font-size="9" text-anchor="middle">Med-09 (285° NW)</text>
              </g>
              <polygon points="125,112 118,132 132,132" fill="#34D399"/>
            </svg>
          </div>
          <div class="card orange-border">
            <div class="title">🤖 GPT / Tactical Mesh Copilot</div>
            <div class="sub">${S.aiSummary}</div>
          </div>
          ${S.peers.map(p => `
            <div class="card">
              <div class="row">
                <div class="glyph">${p.dir}</div>
                <div style="flex:1;">
                  <div class="title">${p.name} · ~${p.dist}m</div>
                  <div class="sub">Compass Bearing: ${p.bearing}° (${p.dir}) · ${p.radios}</div>
                </div>
                <button class="btn-green" onclick="S.connected=true;S.tab='TALK';render()">Connect</button>
              </div>
            </div>
          `).join('')}
        `;
      } else if (S.tab === 'ALERT') {
        vp.innerHTML = `
          <div class="sub" style="color:var(--orange);font-weight:800;">Broadcast channel (All / Wi-Fi / Bluetooth)</div>
          <div class="chips-row">
            ${['All', 'Wi-Fi', 'Bluetooth'].map(c => `<button class="chip" style="${S.alertCh===c?'border-color:var(--green);background:var(--bg-elevated);':''}" onclick="S.alertCh='${c}';render()">📡 ${c}</button>`).join('')}
          </div>
          <div class="sub" style="color:var(--green);font-weight:800;">Quick alerts</div>
          ${[
            ['⚠️', 'आपातकाल — सहायता चाहिए', 'Emergency SOS'],
            ['🧰', 'चिकित्सा सहायता चाहिए', 'Medical Help'],
            ['🏃', 'तुरंत निकलें', 'Evacuate Now'],
            ['🛡️', 'अपनी जगह पर रहें', 'Hold Position'],
            ['✅', 'सब ठीक है', 'All Clear']
          ].map(([ic, hi, en]) => `
            <div class="card" style="cursor:pointer;" onclick="sendChat('${hi} (${en})', true);setTab('TALK')">
              <div class="row">
                <div class="glyph">${ic}</div>
                <div style="flex:1;"><div class="title">${hi}</div><div class="sub">${en}</div></div>
                <div style="color:var(--orange);font-weight:900;font-size:18px;">➤</div>
              </div>
            </div>
          `).join('')}
          <div class="card">
            <div class="title">Custom message (Type / Speak)</div>
            <textarea id="customSos" rows="2" placeholder="Free text (0 / 200)..."></textarea>
            <div class="chips-row" style="margin-top:8px;">
              ${['Need Water & Food', 'Road Blocked', 'Injured Person'].map(t => `<button class="chip" onclick="document.getElementById('customSos').value='${t}'">${t}</button>`).join('')}
            </div>
            <button class="btn-orange btn-block" onclick="sendChat(document.getElementById('customSos').value || 'Emergency Need Water & Food', true);setTab('TALK')">➤ Send typed alert</button>
          </div>
        `;
      } else if (S.tab === 'HISTORY') {
        vp.innerHTML = S.messages.map(m => `
          <div class="card">
            <div class="title">${m.text}</div>
            <div class="sub">${m.dir === 'in' ? '↙ Inbound' : '↗ Outbound'} · ${m.peer} · ${m.status}</div>
          </div>
        `).join('');
      } else if (S.tab === 'SETTINGS') {
        vp.innerHTML = `
          <div class="card" style="text-align:center;">
            <div style="font-size:32px;">👤</div>
            <div class="title" style="margin-top:4px;">${S.name}</div>
            <div class="sub">Talk2 Walkie-Talkie · ISRO SIH PS 26173</div>
          </div>
          <div class="card orange-border">
            <div class="title">☁️ GitHub Release / Google Drive Model Pack Link</div>
            <div class="sub">All 41 ONNX + Vocab files (model-pack-v1) download directly from this URL into phone storage:</div>
            <input value="${S.githubUrl}" oninput="S.githubUrl=this.value" />
          </div>
          <div class="sub" style="color:var(--green);font-weight:800;">SPEECH & LANGUAGES (TAP TO DOWNLOAD / ACTIVATE)</div>
          ${S.packs.map(p => `
            <div class="card ${S.lang.code===p.code ? 'active-border' : ''}" style="cursor:pointer;" onclick="toggleDownload('${p.code}')">
              <div class="row">
                <div class="glyph">${p.glyph}</div>
                <div style="flex:1;">
                  <div class="title">${p.endonym} (${p.en})</div>
                  <div class="sub">${p.mb} · ${p.dl ? 'Downloaded Offline' : 'Tap to fetch from Repo/Drive'}</div>
                </div>
                <div style="color:var(--orange);font-weight:800;">${S.lang.code===p.code ? 'ACTIVE' : (p.dl ? '✅' : '☁️⬇')}</div>
              </div>
            </div>
          `).join('')}
        `;
      }
    }
    render();
  </script>
</body>
</html>
